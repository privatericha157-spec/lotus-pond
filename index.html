function sound(){try{if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=450;gn=ac.createGain();gn.gain.value=muted?0:.2;s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start()}catch(e){}}

const stk=p=>(p.last==ds(0)||p.last==ds(-1))?p.streak:0;
const log=(p,x)=>p.log.push({d:new Date().toISOString(),x});
function newCat(p){const own=p.cats.map(c=>c.id),free=[];for(let f=0;f<8;f++)for(let a=0;a<10;a++)for(let e=0;e<8;e++){const id=f+"-"+a+"-"+e;if(!own.includes(id))free.push(id)}if(!free.length)return null;const id=R(free);p.cats.push({id,at:ds(0)});return id}
function pick(flt){const p=S.p,pool=T.filter(t=>!p.topics.includes(t.id)&&!S.seen.includes(t.id)&&flt(t));if(!pool.length){const rest=T.filter(t=>!p.topics.includes(t.id)&&flt(t));if(!rest.length)return null;S.seen=[];return R(rest)}return R(pool)}
function next(flt,label){if(flt)S.f=flt;S.fl=label||S.fl;const t=pick(S.f||(()=>true));if(!t){S.topic=null;toast("You’ve explored everything in that group. Try another mood!")}else{S.topic=t;S.seen.push(t.id)}S.tab="explore";render()}
function complete(){const p=S.p,t=S.topic;if(!t||p.topics.includes(t.id))return;
p.topics.push(t.id);p.done++;if(p.last!==ds(0)){p.streak=p.last===ds(-1)?p.streak+1:1;p.last=ds(0)}
log(p,"Explored “"+t.title+"” (topic "+p.done+")");const cid=newCat(p);if(cid)log(p,"Welcomed "+catInfo(cid).name);
let h=`<h2>Wonderful!</h2><p>“${esc(t.title)}” is now part of your journey.</p>`,bloom=false;
if(cid)h+=`<div style="width:150px;margin:auto">${catSVG(cid,150)}</div><h3>${esc(catInfo(cid).name)}</h3><p class="m">${esc(catInfo(cid).per)}</p><p>A new friend joins your sanctuary.</p>`;
if(p.done%2==0){const used=p.quests.map(q=>q.n),fr=SUB.map((_,i)=>i).filter(i=>!used.includes(i));p.quests.push({id:Date.now(),n:R(fr.length?fr:SUB.map((_,i)=>i)),done:false,at:p.done});log(p,"Painting quest unlocked");h+=`<p>🎨 A painting quest has been unlocked in your Painting Gallery.</p>`}
if(p.done%5==0){p.blooms.push({n:p.blooms.length+1,at:p.done,date:ds(0)});log(p,"Lotus #"+p.blooms.length+" bloomed");bloom=true;h+=pond(p.blooms.length,true)+`<p><b>A lotus has bloomed!</b> Your pond grows more beautiful with every question.</p>`}
save();S.topic=null;modal(h+`<button class="b" data-a="close">Continue</button>`);render()}
function modal(h,l){$("#md").innerHTML=`<div class="mb ${l?"l":""}" role="dialog" aria-modal="true">${h}</div>`;$("#md").hidden=false}
function close(){$("#md").hidden=true;$("#md").innerHTML=""}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.78))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
const FL=["colours","focus","enjoyed","meaning","details"],FQ=["Why did you choose your colours?","Which elements did you focus on?","What did you enjoy painting?","What does the painting mean to you?","Which details caught your attention?"];
function paintModal(qid){const q=S.p.quests.find(x=>x.id==qid);if(!q)return;S.qid=qid;S.img=null;
modal(`<h2>${esc(SUB[q.n][0])}</h2><label>Photo of your painting<input type="file" id="pf" accept="image/*"></label><div id="pv"></div><p class="m">Optional reflection. There is no right way to paint, and nothing is judged or compared.</p>`+FQ.map((x,i)=>`<label>${x}<textarea rows="2" id="f${i}"></textarea></label>`).join("")+`<button class="b g" data-a="reading">Offer a gentle reading</button><label>Possible observations (yours to edit or delete)<textarea rows="5" id="rd"></textarea></label><p class="m">These are playful possibilities drawn only from your words, not facts about you.</p><button class="b" data-a="savePaint">Save to my gallery</button><button class="b g" data-a="close">Cancel</button>`,1);
$("#pf").onchange=async e=>{try{S.img=await shrink(e.target.files[0]);$("#pv").innerHTML=`<div class="pt"><img src="${S.img}" alt="Preview of your painting"></div>`}catch(x){toast("That file couldn’t be read as an image.")}}}
function reading(){const f=FL.map((_,i)=>$("#f"+i).value.trim().slice(0,90)),L=[];
if(f[0])L.push(`You might enjoy colour as a way of setting a mood (“${f[0]}”).`);if(f[1])L.push(`Your attention may rest on certain elements (“${f[1]}”), which could be a recurring interest.`);if(f[2])L.push(`The part you enjoyed (“${f[2]}”) may point to what feels playful for you.`);if(f[3])L.push(`You seem to give the painting a personal meaning (“${f[3]}”), perhaps a theme you return to.`);if(f[4])L.push(`Small details (“${f[4]}”) may matter to you.`);
$("#rd").value=L.length?"Possibilities only:\n"+L.join("\n"):"Share a few words above and a gentle reading will appear here."}
function savePaint(){const p=S.p,q=p.quests.find(x=>x.id==S.qid);if(!S.img)return toast("Please add a photo of your painting first.");if(!q||q.done)return;
const pt={id:Date.now(),img:S.img,subject:SUB[q.n][0],date:ds(0),at:q.at,fields:FL.map((_,i)=>$("#f"+i).value.trim()),reading:$("#rd").value.trim()};
p.paintings.push(pt);q.done=true;log(p,"Painted “"+pt.subject+"” (quest after topic "+q.at+")");if(!save()){p.paintings.pop();q.done=false;p.log.pop();return}close();toast("Saved to your gallery. Lovely!");S.tab="paint";render()}
function exportJ(){$("#ex").value=JSON.stringify(S.p)}
function importJ(){try{const o=JSON.parse($("#im").value);if(!o.name||!o.salt||!o.hash||!Array.isArray(o.topics))throw 0;const k=o.name.toLowerCase();if(DB.profiles[k]&&!confirm("A journal named “"+o.name+"” exists. Replace it?"))return;DB.profiles[k]=o;if(save())toast("Journal restored. Log in with its PIN.")}catch(e){toast("That doesn’t look like a Lotus Pond backup.")}}
async function auth(create){const n=$("#jn").value.trim(),pin=$("#pn").value,k=n.toLowerCase(),m=$("#lm");
if(!n||!/^\d\d$/.test(pin)){m.textContent="Please enter a journal name and a two-digit PIN (00–99).";return}
let p=DB.profiles[k];if(create){if(p){m.textContent="That journal already exists. Try opening it instead.";return}const salt=Math.random().toString(36).slice(2);p={name:n,salt,hash:await hash(salt+pin),created:new Date().toISOString(),done:0,topics:[],cats:[],quests:[],paintings:[],blooms:[],log:[],streak:0,last:""};log(p,"Journal created");DB.profiles[k]=p;if(!save())return}
else if(!p||await hash(p.salt+pin)!==p.hash){m.textContent="That journal name and PIN don’t match.";return}
S.p=p;S.tab="home";S.topic=null;S.seen=[];sound();render()}
// ---- views ----
const TABS=[["home","Home"],["explore","Explore"],["cats","My Cats"],["paint","Painting Gallery"],["pond","My Lotus Pond"],["journey","My Journey"]];
function render(){const p=S.p,a=$("#app");if(!p){a.innerHTML=`<div class="card" style="text-align:center;margin-top:8vh"><div style="width:120px;margin:auto">${frog(120)}</div><h1>Enter the Pond</h1><p>Welcome, traveller. A quiet pond of ideas awaits you.</p><label>Journal name<input id="jn" autocomplete="off" maxlength="30"></label><label>Two-digit PIN (00–99)<input id="pn" inputmode="numeric" maxlength="2" pattern="[0-9]{2}" type="password" autocomplete="off"></label><p id="lm" role="alert" style="color:var(--bur);min-height:1.5em"></p><button class="b" data-a="open">Open my journal</button><button class="b g" data-a="create">Create new journal</button><p class="m">The PIN is only a playful personal lock, not real security. Please don’t store sensitive information here. Everything stays in this browser and nothing is ever sent anywhere.</p></div>`;return}
let h=`<header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h1>🪷 ${esc(p.name)}</h1><div><button class="b g" style="color:#f2e8d5;border-color:#f2e8d5" data-a="mute" aria-pressed="${muted}">${muted?"🔇 Sound off":"🔊 Sound on"}</button><button class="b g" style="color:#f2e8d5;border-color:#f2e8d5" data-a="logout">Log out</button></div></header><nav aria-label="Sections">${TABS.map(t=>`<button class="b" data-a="tab" data-v="${t[0]}" ${S.tab==t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("")}</nav>`;
if(S.tab=="home")h+=`<div class="card"><h2>Welcome back, little explorer.</h2><p>The pond has been waiting for you.</p><div class="grid">${[[p.done,"Topics explored"],[p.cats.length,"Cats collected"],[p.paintings.length,"Paintings completed"],[p.blooms.length,"Lotuses bloomed"],[stk(p),"Day streak"]].map(s=>`<div class="st"><b>${s[0]}</b><span class="m">${s[1]}</span></div>`).join("")}</div></div>${pond(p.blooms.length)}<p style="text-align:center"><button class="b big" data-a="discover">Discover Today’s Curiosity</button></p>`;
if(S.tab=="explore"){h+=`<div class="card"><h2>How are you feeling?</h2><div class="chips">${MOODS.map(m=>`<button class="b g" data-a="mood" data-v="${m[1]}|${m[0]}">${m[0]}</button>`).join("")}</div><button class="b" data-a="surprise">Surprise Me</button><button class="b" data-a="culture">Explore Another Culture</button><button class="b" data-a="deep">Deep Dive</button><button class="b" data-a="light">Light Reading</button></div>`;const t=S.topic;
h+=t?`<article class="card"><p class="m">${esc(t.cat)} · ${esc(t.origin)}${S.fl?" · mood: "+esc(S.fl):""}</p><h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p><p class="m">Keywords: ${esc(t.kw)}</p><p><b>Where to read further:</b> ${esc(t.src)}</p><p class="m">Short summaries only. Please check the sources for details.</p><button class="b" data-a="done">I Explored This Topic — Done!</button><button class="b g" data-a="another">Generate Another</button><button class="b g" data-a="skip">Skip</button></article>`:`<div class="card"><p>Pick a mood or press a button to find a topic. Skipping never affects your progress.</p></div>`}
if(S.tab=="cats")h+=`<h2>My Cats (${p.cats.length})</h2>${p.cats.length?`<div class="grid">${p.cats.map(c=>{const i=catInfo(c.id);return`<div class="card cat st">${catSVG(c.id)}<b style="font:700 1.2rem Cormorant Garamond,serif">${esc(i.name)}</b><p class="m">${esc(i.per)}<br>Met ${esc(c.at)}</p></div>`}).join("")}</div>`:`<div class="card">No cats yet. Complete a topic to meet your first one.</div>`}`;
if(S.tab=="paint"){const pend=p.quests.filter(q=>!q.done);h+=`<h2>Painting Gallery</h2>`+(pend.length?pend.map(q=>`<div class="card"><h3>Painting Quest: ${esc(SUB[q.n][0])}</h3>${scene(q.n)}<p>${esc(SUB[q.n][1])}</p><p><b>Creative challenge:</b> ${esc(SUB[q.n][2])}</p><button class="b" data-a="paintm" data-v="${q.id}">I Painted This!</button></div>`).join(""):`<div class="card m">No open quests. A new one unlocks after every two completed topics (${2-p.done%2} more to go).</div>`)+(p.paintings.length?`<div class="grid">${p.paintings.slice().reverse().map(x=>`<div class="card pt"><img src="${x.img}" alt="${esc(x.subject)}"><h3>${esc(x.subject)}</h3><p class="m">${esc(x.date)} · quest after topic ${x.at}</p>${x.reading?`<p style="white-space:pre-wrap">${esc(x.reading)}</p>`:""}</div>`).join("")}</div>`:"")}
if(S.tab=="pond"){const n=p.blooms.length;h+=`<h2>My Lotus Pond</h2>${pond(n)}<div class="card"><p>${n} lotus${n==1?"":"es"} in bloom. Next bloom in ${5-p.done%5} completed topic${5-p.done%5==1?"":"s"}.</p>${n?p.blooms.map(b=>`<p class="m">🪷 Lotus ${b.n}: bloomed after topic ${b.at}, ${esc(b.date)}</p>`).join(""):""}</div>`}
if(S.tab=="journey")h+=`<h2>My Journey</h2><div class="card"><p>Journal created ${esc(p.created.slice(0,10))}. ${p.done} topics explored.</p>${p.log.length?p.log.slice().reverse().map(l=>`<p class="m">${esc(l.d.slice(0,10))} — ${esc(l.x)}</p>`).join(""):""}</div><div class="card"><h3>Back up your journal</h3><p class="m">Your data lives only in this browser. Press the button, copy the text and keep it somewhere safe (paintings make it large). To restore, paste it below.</p><button class="b" data-a="export">Show my backup</button><textarea id="ex" rows="3" readonly aria-label="Backup data"></textarea><textarea id="im" rows="3" placeholder="Paste a backup here to restore" aria-label="Restore data"></textarea><button class="b g" data-a="import">Restore from backup</button></div>`;
h+=`<div class="fr"><div style="width:64px">${frog(64)}</div><div class="bub" id="fb">${R(FROG)}</div></div>`;a.innerHTML=h}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const v=b.dataset.v,A={
open:()=>auth(0),create:()=>auth(1),close,tab:()=>{S.tab=v;render()},logout:()=>{S.p=null;S.topic=null;render()},mute:()=>{muted=!muted;if(gn)gn.gain.value=muted?0:.2;render()},
discover:()=>next(()=>true,""),mood:()=>{const[k,l]=v.split("|");next(t=>t.mood.split(" ").includes(k),l)},surprise:()=>next(()=>true,"surprise"),
culture:()=>{const r=R(REG);next(t=>t.region==r,"culture: "+r)},deep:()=>next(t=>t.deep==1,"deep dive"),light:()=>next(t=>t.deep==0,"light reading"),
another:()=>next(),skip:()=>{toast("No worries. Nothing changes.");next()},done:complete,paintm:()=>paintModal(v),reading,savePaint,export:exportJ,import:importJ};A[b.dataset.a]&&A[b.dataset.a]()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="pn")auth(0);if(e.key=="Escape")close()});
setInterval(()=>{const f=$("#fb");if(f)f.textContent=R(FROG)},15000);
$("#lf").innerHTML=frog(130);render();setTimeout(()=>{$("#ld").style.opacity=0;setTimeout(()=>$("#ld").remove(),1000)},1300);
</script></body></html>
